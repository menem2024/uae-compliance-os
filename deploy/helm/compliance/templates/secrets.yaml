# Dev-only Secrets for the walking skeleton (values.secrets.create). Staging
# sets create=false and supplies the same key names via sealed-secrets.
{{- if .Values.secrets.create }}
apiVersion: v1
kind: Secret
metadata:
  name: compliance-db-owner
  labels:
    {{- include "compliance.labels" (dict "root" $ "name" "postgres" "component" "database") | nindent 4 }}
type: Opaque
stringData:
  # Consumed by the CNPG Cluster's bootstrap.initdb.secret: the operator
  # creates this role as the owner of the `compliance` database instead of
  # generating a random password.
  username: compliance_owner
  password: {{ .Values.secrets.postgres.ownerPassword | quote }}
---
apiVersion: v1
kind: Secret
metadata:
  name: compliance-db
  labels:
    {{- include "compliance.labels" (dict "root" $ "name" "postgres" "component" "database") | nindent 4 }}
type: Opaque
stringData:
  # api-go and validator-rs connect as compliance_app (NOSUPERUSER,
  # NOBYPASSRLS) per the Global Constraints; only the migrate Job uses the
  # owner URL, for DDL.
  DATABASE_URL: {{ include "compliance.postgresURL" (dict "root" $ "user" "compliance_app" "password" .Values.secrets.postgres.appPassword "database" "compliance") | quote }}
  DATABASE_OWNER_URL: {{ include "compliance.postgresURL" (dict "root" $ "user" "compliance_owner" "password" .Values.secrets.postgres.ownerPassword "database" "compliance") | quote }}
---
apiVersion: v1
kind: Secret
metadata:
  name: zitadel-db
  labels:
    {{- include "compliance.labels" (dict "root" $ "name" "zitadel" "component" "auth") | nindent 4 }}
type: Opaque
stringData:
  # Referenced by the zitadel subchart's .Values.env (see Chart values.yaml)
  # for both the user and admin Postgres connections: the zitadel role owns
  # its own database (CREATEDB, granted in postgres-cluster.yaml's
  # postInitSQL), so there is no exposed Postgres superuser in-cluster.
  password: {{ .Values.secrets.postgres.zitadelPassword | quote }}
---
apiVersion: v1
kind: Secret
metadata:
  name: zitadel-masterkey
  labels:
    {{- include "compliance.labels" (dict "root" $ "name" "zitadel" "component" "auth") | nindent 4 }}
type: Opaque
stringData:
  masterkey: {{ .Values.secrets.zitadelMasterkey | quote }}
---
apiVersion: v1
kind: Secret
metadata:
  name: minio-credentials
  labels:
    {{- include "compliance.labels" (dict "root" $ "name" "minio" "component" "storage") | nindent 4 }}
type: Opaque
stringData:
  MINIO_ACCESS_KEY: {{ .Values.secrets.minio.rootUser | quote }}
  MINIO_SECRET_KEY: {{ .Values.secrets.minio.rootPassword | quote }}
  MINIO_ROOT_USER: {{ .Values.secrets.minio.rootUser | quote }}
  MINIO_ROOT_PASSWORD: {{ .Values.secrets.minio.rootPassword | quote }}
---
apiVersion: v1
kind: Secret
metadata:
  name: web-auth
  labels:
    {{- include "compliance.labels" (dict "root" $ "name" "web" "component" "frontend") | nindent 4 }}
type: Opaque
stringData:
  AUTH_SECRET: {{ .Values.secrets.authSecret | quote }}
{{- end }}
