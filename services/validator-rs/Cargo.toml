[package]
name = "validator-rs"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "validator-rs"
path = "src/main.rs"

[[bin]]
name = "conformance"
path = "src/bin/conformance.rs"

[[bench]]
name = "validate"
harness = false

[dependencies]
tonic = "0.14"
tonic-prost = "0.14"
tonic-health = "0.14"
prost = "0.14"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
tracing-opentelemetry = "0.32"
opentelemetry = "0.31"
opentelemetry_sdk = { version = "0.31", features = ["rt-tokio"] }
opentelemetry-otlp = { version = "0.31", features = ["grpc-tonic", "trace"] }
opentelemetry-http = "0.31"
http = "1"
tower = "0.5"
rust_decimal = { version = "1.43", features = ["std"] }
quick-xml = "0.42"
roxmltree = "0.21"
regex = "1.13"
prost-reflect = { version = "0.16", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
hex = "0.4"

[dev-dependencies]
criterion = "0.8"

[build-dependencies]
tonic-prost-build = "0.14"
protox = "0.9"
prost = "0.14"
