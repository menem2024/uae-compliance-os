[project]
name = "ai"
version = "0.1.0"
description = "Compliance OS AI service: agents, RAG, data science"
readme = "README.md"
authors = [
    { name = "Abdalmonem Khalel", email = "abdalmonemkhalel21@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "anthropic==1.8.0",
    "minio>=7.2.20",
    "nats-py>=2.16.0",
    "openpyxl>=3.1.5",
    "opentelemetry-exporter-otlp-proto-grpc>=1.45.0",
    "opentelemetry-exporter-otlp-proto-http>=1.45.0",
    "opentelemetry-sdk>=1.45.0",
    "protobuf>=7.36.2",
    "pydantic>=2.13",
    "pypdfium2>=5.13",
    "redis>=8.1",
]

[project.entry-points."compliance.agents"]
extraction = "ai.agents.extraction.plugin:register"
intake = "ai.agents.intake.plugin:register"

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "fakeredis>=2.38",
    "fpdf2>=2.8.8",
    "grpcio-tools>=1.84.0",
    "pillow>=12.3",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.9",
    "uharfbuzz>=0.56",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "--import-mode=importlib"

[tool.ruff]
line-length = 110
extend-exclude = ["src/ai/gen"]
