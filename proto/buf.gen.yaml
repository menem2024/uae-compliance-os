version: v2
managed:
  enabled: true
  override:
    - file_option: go_package_prefix
      value: github.com/menem2024/uae-platform/services/api-go/gen
plugins:
  - local: protoc-gen-go
    out: ../services/api-go/gen
    opt: paths=source_relative
  - local: protoc-gen-connect-go
    out: ../services/api-go/gen
    opt: paths=source_relative
