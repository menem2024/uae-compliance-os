name: go

on:
  push:
    branches: [main]
    paths:
      - "services/api-go/**"
      - "proto/**"
      - ".github/workflows/go.yml"
  pull_request:
    branches: [main]
    paths:
      - "services/api-go/**"
      - "proto/**"
      - ".github/workflows/go.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17.6
        env:
          POSTGRES_PASSWORD: pg
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: services/api-go/go.mod
          cache-dependency-path: services/api-go/go.sum

      # golangci-lint is intentionally not wired up here. A local run of
      # `go run github.com/golangci/golangci-lint/v2/cmd/golangci-lint@latest run ./...`
      # against the current services/api-go code reports 5 pre-existing findings
      # (2 errcheck in cmd/api/main.go and internal/db/migrate.go, 3 staticcheck
      # SA1019 deprecations in internal/validator/client.go). Fixing Go source is
      # out of scope for this CI story (see story-9-report.md). Re-add a
      # golangci-lint step once those findings are cleared in services/api-go.

      - name: go vet
        working-directory: services/api-go
        run: go vet ./...

      - name: go test (unit)
        working-directory: services/api-go
        run: go test ./...

      - name: Apply init.sql (roles, databases, grants)
        env:
          PGPASSWORD: pg
        run: psql -h localhost -U postgres -v ON_ERROR_STOP=1 -f deploy/compose/postgres/init.sql

      - name: go test (RLS integration)
        working-directory: services/api-go
        env:
          TEST_OWNER_URL: postgres://compliance_owner:owner_dev_pw@localhost:5432/compliance?sslmode=disable
          TEST_APP_URL: postgres://compliance_app:app_dev_pw@localhost:5432/compliance?sslmode=disable
        run: go test -tags integration ./internal/db/...
