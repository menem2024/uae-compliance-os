name: go

on:
  push:
    branches: [main]
    paths:
      - "services/api-go/**"
      - "proto/**"
      - "deploy/compose/postgres/init.sql"
      - ".github/workflows/go.yml"
  pull_request:
    branches: [main]
    paths:
      - "services/api-go/**"
      - "proto/**"
      - "deploy/compose/postgres/init.sql"
      - ".github/workflows/go.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17.6
        env:
          POSTGRES_PASSWORD: pg
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: services/api-go/go.mod
          cache-dependency-path: services/api-go/go.sum

      - uses: golangci/golangci-lint-action@v9
        with:
          working-directory: services/api-go
          version: v2.14.0

      - name: go vet
        working-directory: services/api-go
        run: go vet ./...

      - name: go test (unit)
        working-directory: services/api-go
        run: go test ./...

      - name: Apply init.sql (roles, databases, grants)
        env:
          PGPASSWORD: pg
        run: psql -h localhost -U postgres -v ON_ERROR_STOP=1 -f deploy/compose/postgres/init.sql

      - name: go test (RLS integration)
        working-directory: services/api-go
        env:
          TEST_OWNER_URL: postgres://compliance_owner:owner_dev_pw@localhost:5432/compliance?sslmode=disable
          TEST_APP_URL: postgres://compliance_app:app_dev_pw@localhost:5432/compliance?sslmode=disable
        run: go test -tags integration ./internal/db/...
